name: mr-review-m2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mr_review_m2
      POSTGRES_USER: mr_review
      POSTGRES_PASSWORD: mr_review
    ports:
      - "127.0.0.1:${M2_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mr_review -d mr_review_m2"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${M2_REDIS_PORT:-56379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
