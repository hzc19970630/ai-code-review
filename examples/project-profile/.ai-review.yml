version: 1

# Optional repository scope overrides. Omitted fields inherit platform defaults;
# a present field replaces that platform list for reviews using this target ref.
supported_extensions:
  - .ts
  - .tsx
  - .js
  - .jsx
  - .json
  - .yml
  - .yaml

ignore_paths:
  - node_modules/**
  - "**/node_modules/**"
  - dist/**
  - "**/dist/**"
  - build/**
  - "**/build/**"
  - pnpm-lock.yaml
  - "**/pnpm-lock.yaml"

profile:
  source_dirs:
    - src
    - services/api/src
  test_dirs:
    - tests
    - services/api/tests
  generated_dirs:
    - dist
    - generated
  key_paths:
    - src/public-api.ts
    - services/api/src/auth.py
  standards:
    - .ai-review/architecture.md
    - .ai-review/testing.md
  companion_patterns:
    - match: src/auth/**
      paths:
        - src/public-api.ts
        - tests/auth.integration.test.ts

rules:
  # Repository settings can only narrow the platform allowlist.
  enable:
    - correctness
    - security
  disable:
    - reliability
  path_rules:
    - match: tests/**
      disable:
        - api_compatibility
