services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mr_review
      POSTGRES_USER: mr_review
      POSTGRES_PASSWORD: mr_review
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mr_review -d mr_review"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    env_file: ${ENV_FILE:-.env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: ${ENV_FILE:-.env}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    env_file: ${ENV_FILE:-.env}
    command: ["python", "apps/worker/main.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dispatcher:
    build: .
    env_file: ${ENV_FILE:-.env}
    command: ["python", "apps/worker/dispatcher.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  reconciler:
    build: .
    env_file: ${ENV_FILE:-.env}
    command: ["python", "apps/worker/reconciler.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
